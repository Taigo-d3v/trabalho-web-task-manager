<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Painel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Task Manager</div>
        <button class="btn-danger" onclick="logout()">Sair</button>
    </header>

    <main class="dashboard-container">
        <section class="task-form-section">
            <h2>Nova Tarefa</h2>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <div class="input-group">
                    <label for="taskTitle">Título</label>
                    <input type="text" id="taskTitle" required maxlength="150">
                </div>
                <div class="input-group">
                    <label for="taskDesc">Descrição</label>
                    <textarea id="taskDesc" rows="3" maxlength="500"></textarea>
                </div>
                <div class="input-group">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus" required>
                        <option value="PENDENTE">Pendente</option>
                        <option value="EM_ANDAMENTO">Em Andamento</option>
                        <option value="CONCLUIDA">Concluída</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="btnSaveTask">Salvar Tarefa</button>
                    <button type="button" class="btn-secondary" onclick="clearForm()" style="display:none;" id="btnCancelEdit">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="task-list-section">
            <h2>Minhas Tarefas</h2>
            <div id="msg-dashboard" class="msg-error"></div>
            <div class="table-responsive">
                <table class="table-dark">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Descrição</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <!-- Tarefas renderizadas dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/dashboard.js"></script>
</body>
</html>
