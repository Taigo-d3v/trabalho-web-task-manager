<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Acesso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Task Manager</h1>
            <p>Gerencie suas tarefas de forma eficiente.</p>
            
            <div class="tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrar</button>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-user">Usuário</label>
                    <input type="text" id="login-user" required>
                </div>
                <div class="input-group">
                    <label for="login-pass">Senha</label>
                    <input type="password" id="login-pass" required>
                </div>
                <button type="submit" class="btn-primary">Acessar</button>
                <div id="login-msg" class="msg-error"></div>
            </form>

            <!-- Formulário de Registro -->
            <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="reg-user">Usuário</label>
                    <input type="text" id="reg-user" required>
                </div>
                <div class="input-group">
                    <label for="reg-pass">Senha</label>
                    <input type="password" id="reg-pass" required>
                </div>
                <button type="submit" class="btn-secondary">Criar Conta</button>
                <div id="reg-msg" class="msg-error"></div>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
